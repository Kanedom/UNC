<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0D5B8F"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Union Health"/>
<meta name="application-name" content="Union Health Clinic"/>
<meta name="description" content="Union Health Clinic — Dr. Kenneth Maima's private patient management system"/>
<title>Union Health Clinic</title>


<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Poppins',sans-serif;background:#F0F4F8;overscroll-behavior:none}
input,select,textarea,button{font-family:'Poppins',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C5D5E8;border-radius:4px}
#root{height:100%}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.fu{animation:fadeUp .32s ease both}
.fi{animation:fadeIn .22s ease both}

.ch{transition:box-shadow .2s,transform .2s}
.ch:hover{box-shadow:0 8px 28px rgba(13,91,143,.13)!important;transform:translateY(-1px)}
.rh{transition:background .15s}
.rh:hover{background:#F5F9FD!important}
.sc{transition:transform .2s,box-shadow .2s}
.sc:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(13,91,143,.15)!important}
.tp{transition:all .18s}
.tp:hover{background:#E3EEF8!important;color:#0D5B8F!important}
.bp:active{transform:scale(.95)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#27A2E0!important;box-shadow:0 0 0 3px rgba(39,162,224,.12)}

/* Install banner */
#install-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#0D5B8F;color:#fff;padding:10px 16px;align-items:center;gap:10px;font-size:13px;font-weight:600}
#install-banner.show{display:flex}
</style>
</head>
<body>
<div id="root"></div>

<!-- Install prompt banner -->
<div id="install-banner">
  <span style="flex:1">📲 Install Union Health Clinic as an app</span>
  <button id="install-btn" style="background:#68B44B;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:Poppins,sans-serif">Install</button>
  <button id="install-dismiss" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:0 4px">×</button>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── TOKENS ──────────────────────────────────────────────────────────────────
const T = {
  pb:"#0D5B8F", sb:"#27A2E0", gr:"#68B44B", lg:"#E6E6E6", dg:"#444444",
  wh:"#FFFFFF", bg:"#F0F4F8", red:"#E74C3C", amber:"#E67E22",
  border:"#DDE7F0", muted:"#8FA3B8", text:"#1A2D42",
};

// ── HELPERS ──────────────────────────────────────────────────────────────────
const uid      = () => Math.random().toString(36).slice(2,9);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate  = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtShort = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short"}) : "—";
const clockStr = () => new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const age      = dob => dob ? Math.floor((Date.now()-new Date(dob))/31557600000) : null;
const ksh      = n => `K ${Number(n).toLocaleString()}`;
const initials = name => name.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();

const BLOOD_TYPES = ["A+","A-","B+","B-","AB+","AB-","O+","O-"];
const AVATAR_COLORS = [T.pb,T.sb,T.gr,"#8B5CF6","#EC4899","#14B8A6","#F59E0B","#EF4444"];
const avatarColor = name => AVATAR_COLORS[(name.charCodeAt(0)||0) % AVATAR_COLORS.length];

// localStorage persistence
const LS = {
  get: (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){return d;} },
  set: (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

// ── ICONS ────────────────────────────────────────────────────────────────────
const Ico = ({ n, s=18, c="currentColor", sw=2 }) => {
  const p = { width:s, height:s, viewBox:"0 0 24 24", fill:"none", stroke:c, strokeWidth:sw, strokeLinecap:"round", strokeLinejoin:"round", style:{display:"block",flexShrink:0} };
  const M = {
    home:     <svg {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>,
    users:    <svg {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
    calendar: <svg {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>,
    file:     <svg {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>,
    wallet:   <svg {...p}><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 13a1 1 0 1 0 2 0 1 1 0 0 0-2 0z" fill={c}/><line x1="2" y1="10" x2="22" y2="10"/></svg>,
    plus:     <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    search:   <svg {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
    x:        <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    check:    <svg {...p}><polyline points="20,6 9,17 4,12"/></svg>,
    trash:    <svg {...p}><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
    edit:     <svg {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
    chevron:  <svg {...p}><polyline points="9,18 15,12 9,6"/></svg>,
    bell:     <svg {...p}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
    steth:    <svg {...p}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>,
    eye:      <svg {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  };
  return M[n] || null;
};

// ── BASE UI ──────────────────────────────────────────────────────────────────
const Avatar = ({ name, size=40 }) => {
  const bg = avatarColor(name||"?");
  return <div style={{width:size,height:size,borderRadius:"50%",background:`linear-gradient(135deg,${bg}dd,${bg}99)`,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:size*0.35,flexShrink:0,boxShadow:`0 2px 8px ${bg}44`}}>{initials(name||"?")}</div>;
};

const Badge = ({ label, color=T.sb, dot=false }) => (
  <span style={{display:"inline-flex",alignItems:"center",gap:4,background:`${color}18`,color,border:`1px solid ${color}33`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>
    {dot&&<span style={{width:6,height:6,borderRadius:"50%",background:color,display:"inline-block"}}/>}
    {label}
  </span>
);

const Card = ({ children, style={}, cls="" }) => (
  <div className={`ch ${cls}`} style={{background:T.wh,borderRadius:16,boxShadow:"0 2px 16px rgba(13,91,143,.07)",border:`1px solid ${T.border}`,padding:20,...style}}>{children}</div>
);

const SecTitle = ({ children, action }) => (
  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
    <h2 style={{fontSize:17,fontWeight:700,color:T.text}}>{children}</h2>
    {action}
  </div>
);

const Fld = ({ label, children }) => (
  <div style={{display:"flex",flexDirection:"column",gap:5}}>
    <label style={{fontSize:11,fontWeight:600,color:T.muted,textTransform:"uppercase",letterSpacing:.6}}>{label}</label>
    {children}
  </div>
);

const IS = { width:"100%",border:`1.5px solid ${T.border}`,borderRadius:10,padding:"10px 13px",fontSize:13.5,color:T.text,background:T.wh,transition:"border-color .15s,box-shadow .15s" };
const Inp  = ({ label, ...p }) => <Fld label={label}><input style={IS} {...p}/></Fld>;
const Sel  = ({ label, children, ...p }) => <Fld label={label}><select style={{...IS,cursor:"pointer"}} {...p}>{children}</select></Fld>;
const Txta = ({ label, ...p }) => <Fld label={label}><textarea style={{...IS,resize:"vertical",minHeight:80}} {...p}/></Fld>;

const Btn = ({ children, variant="primary", size="md", onClick, style={}, disabled=false }) => {
  const V = {
    primary:   {background:T.pb,color:"#fff",border:"none"},
    secondary: {background:"transparent",color:T.pb,border:`1.5px solid ${T.pb}`},
    green:     {background:T.gr,color:"#fff",border:"none"},
    danger:    {background:T.red,color:"#fff",border:"none"},
    ghost:     {background:"transparent",color:T.muted,border:`1.5px solid ${T.border}`},
  };
  const S = {
    sm:{padding:"5px 12px",fontSize:12,borderRadius:8},
    md:{padding:"9px 18px",fontSize:13.5,borderRadius:10},
    lg:{padding:"12px 24px",fontSize:15,borderRadius:12},
  };
  return <button className="bp" disabled={disabled} onClick={onClick} style={{display:"inline-flex",alignItems:"center",gap:7,fontWeight:600,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,transition:"opacity .15s,transform .1s",...V[variant],...S[size],...style}}>{children}</button>;
};

const Divider = () => <div style={{height:1,background:T.border,margin:"4px 0"}}/>;

const Modal = ({ title, onClose, children, width=540 }) => {
  useEffect(() => {
    const esc = e => e.key==="Escape"&&onClose();
    document.addEventListener("keydown",esc);
    return ()=>document.removeEventListener("keydown",esc);
  },[]);
  return (
    <div className="fi" onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(10,30,60,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(3px)"}}>
      <div className="fu" style={{background:T.wh,borderRadius:20,width:"100%",maxWidth:width,maxHeight:"92vh",overflow:"auto",boxShadow:"0 20px 60px rgba(13,91,143,.25)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 22px",borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,background:T.wh,zIndex:1,borderRadius:"20px 20px 0 0"}}>
          <span style={{fontWeight:700,fontSize:16,color:T.text}}>{title}</span>
          <button onClick={onClose} style={{background:"#F0F4F8",border:"none",cursor:"pointer",width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:T.muted}}><Ico n="x" s={15}/></button>
        </div>
        <div style={{padding:22}}>{children}</div>
      </div>
    </div>
  );
};

const Empty = ({ icon, title, sub, action }) => (
  <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"52px 20px",gap:12,textAlign:"center"}}>
    <div style={{width:64,height:64,borderRadius:"50%",background:`${T.sb}14`,display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n={icon} s={28} c={T.sb}/></div>
    <div style={{fontWeight:700,fontSize:15,color:T.text}}>{title}</div>
    <div style={{fontSize:13,color:T.muted,maxWidth:240}}>{sub}</div>
    {action}
  </div>
);

const SearchBar = ({ value, onChange, placeholder="Search…" }) => (
  <div style={{position:"relative",flex:1}}>
    <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:T.muted,pointerEvents:"none"}}><Ico n="search" s={15}/></span>
    <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{...IS,paddingLeft:36,width:"100%"}}/>
  </div>
);

const Confirm = ({ msg, onYes, onNo }) => (
  <Modal title="Confirm" onClose={onNo} width={360}>
    <p style={{fontSize:14,color:T.dg,marginBottom:20}}>{msg}</p>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <Btn variant="ghost" onClick={onNo}>Cancel</Btn>
      <Btn variant="danger" onClick={onYes}>Delete</Btn>
    </div>
  </Modal>
);

// ── DASHBOARD ────────────────────────────────────────────────────────────────
const Dashboard = ({ patients, appointments, records, finance, setTab }) => {
  const todayAppts = appointments.filter(a=>a.date===todayStr()&&a.status==="upcoming");
  const upcoming   = appointments.filter(a=>a.date>=todayStr()&&a.status==="upcoming").sort((a,b)=>a.date>b.date?1:-1);
  const totalIn    = finance.filter(f=>f.type==="income"&&f.paid).reduce((s,f)=>s+f.amount,0);
  const totalOut   = finance.filter(f=>f.type==="expense"&&f.paid).reduce((s,f)=>s+f.amount,0);
  const unpaid     = finance.filter(f=>f.type==="income"&&!f.paid).reduce((s,f)=>s+f.amount,0);

  const stats=[
    {label:"Total Patients", value:patients.length, icon:"users",    color:T.pb,    sub:"Registered"},
    {label:"Today's Appts",  value:todayAppts.length,icon:"calendar",color:T.sb,    sub:"Scheduled"},
    {label:"Net Revenue",    value:ksh(totalIn-totalOut),icon:"wallet",color:T.gr,  sub:"All time"},
    {label:"Pending",        value:ksh(unpaid),      icon:"bell",     color:T.amber, sub:"Outstanding"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",gap:24}}>
      <div style={{background:`linear-gradient(135deg,${T.pb} 0%,#1a7abf 100%)`,borderRadius:20,padding:"24px 26px",color:"#fff",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",right:-20,top:-20,width:160,height:160,borderRadius:"50%",background:"rgba(255,255,255,.06)"}}/>
        <div style={{position:"absolute",right:30,bottom:-30,width:100,height:100,borderRadius:"50%",background:"rgba(255,255,255,.04)"}}/>
        <div style={{position:"relative"}}>
          <div style={{fontSize:12,opacity:.75,fontWeight:500,marginBottom:4}}>{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
          <div style={{fontSize:22,fontWeight:800,lineHeight:1.2}}>Good day,</div>
          <div style={{fontSize:22,fontWeight:800,lineHeight:1.2,marginBottom:14}}>Dr. Kenneth Maima 👋</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <span style={{background:"rgba(255,255,255,.18)",borderRadius:20,padding:"4px 14px",fontSize:12,fontWeight:600}}>{todayAppts.length} appointment{todayAppts.length!==1?"s":""} today</span>
            <span style={{background:"rgba(104,180,75,.3)",borderRadius:20,padding:"4px 14px",fontSize:12,fontWeight:600}}>{patients.length} patient{patients.length!==1?"s":""} total</span>
          </div>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:14}}>
        {stats.map(s=>(
          <div key={s.label} className="sc" style={{background:T.wh,borderRadius:16,padding:18,border:`1px solid ${T.border}`,boxShadow:"0 2px 12px rgba(13,91,143,.06)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <div style={{width:38,height:38,borderRadius:12,background:`${s.color}16`,display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n={s.icon} s={18} c={s.color}/></div>
              <span style={{fontSize:10,fontWeight:600,color:T.muted,background:T.bg,borderRadius:20,padding:"2px 8px"}}>{s.sub}</span>
            </div>
            <div style={{fontSize:22,fontWeight:800,color:T.text,lineHeight:1}}>{s.value}</div>
            <div style={{fontSize:11,color:T.muted,marginTop:4,fontWeight:500}}>{s.label}</div>
          </div>
        ))}
      </div>

      <Card>
        <SecTitle action={<button onClick={()=>setTab("appointments")} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:T.sb,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>View all <Ico n="chevron" s={13} c={T.sb}/></button>}>Today's Schedule</SecTitle>
        {todayAppts.length===0
          ? <div style={{textAlign:"center",padding:"20px 0",color:T.muted,fontSize:13}}>No appointments today.</div>
          : todayAppts.map(a=>{
              const p=patients.find(x=>x.id===a.patientId);
              return <div key={a.id} className="rh" style={{display:"flex",alignItems:"center",gap:14,padding:"11px 8px",borderRadius:10}}>
                <div style={{background:`${T.sb}16`,color:T.sb,borderRadius:10,padding:"7px 10px",fontWeight:700,fontSize:12,minWidth:58,textAlign:"center"}}>{a.time}</div>
                {p&&<Avatar name={p.name} size={36}/>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:13.5,color:T.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p?.name||"Unknown"}</div>
                  <div style={{fontSize:11.5,color:T.muted}}>{a.reason}</div>
                </div>
                <Badge label="Today" color={T.gr} dot/>
              </div>;
            })
        }
      </Card>

      {upcoming.filter(a=>a.date!==todayStr()).length>0&&(
        <Card>
          <SecTitle>Upcoming Appointments</SecTitle>
          {upcoming.filter(a=>a.date!==todayStr()).slice(0,5).map(a=>{
            const p=patients.find(x=>x.id===a.patientId);
            return <div key={a.id} className="rh" style={{display:"flex",alignItems:"center",gap:12,padding:"9px 8px",borderRadius:10}}>
              <div style={{minWidth:52,textAlign:"center"}}>
                <div style={{fontSize:18,fontWeight:800,color:T.pb,lineHeight:1}}>{new Date(a.date+"T12:00:00").getDate()}</div>
                <div style={{fontSize:10,color:T.muted,fontWeight:600}}>{new Date(a.date+"T12:00:00").toLocaleString("en-GB",{month:"short"})}</div>
              </div>
              <div style={{width:1,height:36,background:T.border}}/>
              {p&&<Avatar name={p.name} size={34}/>}
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13,color:T.text}}>{p?.name||"Unknown"}</div>
                <div style={{fontSize:11,color:T.muted}}>{a.time} · {a.reason}</div>
              </div>
            </div>;
          })}
        </Card>
      )}

      {(totalIn>0||totalOut>0)&&(
        <Card>
          <SecTitle action={<button onClick={()=>setTab("finance")} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:T.sb,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>View all <Ico n="chevron" s={13} c={T.sb}/></button>}>Financial Summary</SecTitle>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            {[{label:"Income",val:ksh(totalIn),color:T.gr},{label:"Expense",val:ksh(totalOut),color:T.red},{label:"Net",val:ksh(totalIn-totalOut),color:T.pb}].map(f=>(
              <div key={f.label} style={{background:T.bg,borderRadius:12,padding:"12px 14px"}}>
                <div style={{fontSize:10,fontWeight:600,color:T.muted,marginBottom:4}}>{f.label}</div>
                <div style={{fontSize:14,fontWeight:800,color:f.color}}>{f.val}</div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
};

// ── PATIENTS ─────────────────────────────────────────────────────────────────
const PatientForm = ({ initial={}, onSave, onClose }) => {
  const [f,setF]=useState({name:"",dob:"",phone:"",email:"",bloodType:"",allergies:"",notes:"",gender:"",address:"",...initial});
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const valid=f.name.trim().length>1;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <Inp label="Full Name *" value={f.name} onChange={set("name")} placeholder="e.g. Jane Wambui Njoroge"/>

const Appointments = ({ appointments, setAppointments, patients }) => {
  const [modal,setModal]=useState(null);
  const [sel,setSel]=useState(null);
  const [filter,setFilter]=useState("all");
  const [conf,setConf]=useState(null);

  const sorted=[...appointments].sort((a,b)=>a.date>b.date?1:a.date<b.date?-1:a.time>b.time?1:-1);
  const filtered=sorted.filter(a=>{
    if(filter==="today")     return a.date===todayStr()&&a.status==="upcoming";
    if(filter==="upcoming")  return a.status==="upcoming";
    if(filter==="completed") return a.status==="completed";
    if(filter==="cancelled") return a.status==="cancelled";
    return true;
  });

  const save=form=>{
    if(modal==="add") setAppointments(prev=>[...prev,{...form,id:uid()}]);
    else setAppointments(prev=>prev.map(a=>a.id===sel.id?{...a,...form}:a));
    setModal(null);setSel(null);
  };
  const complete=id=>setAppointments(prev=>prev.map(a=>a.id===id?{...a,status:"completed"}:a));
  const del=id=>{setAppointments(prev=>prev.filter(a=>a.id!==id));setConf(null);};
  const sCol=s=>s==="completed"?T.gr:s==="cancelled"?T.red:T.sb;
  const todayCount=appointments.filter(a=>a.date===todayStr()&&a.status==="upcoming").length;
  const tabs=[{id:"all",label:"All"},{id:"today",label:`Today${todayCount>0?` (${todayCount})`:""}`},{id:"upcoming",label:"Upcoming"},{id:"completed",label:"Completed"},{id:"cancelled",label:"Cancelled"}];

  return (
    <div className="fu" style={{display:"flex",flexDirection:"column",gap:18}}>
      <SecTitle action={<Btn onClick={()=>{setSel(null);setModal("add");}}><Ico n="plus" s={15} c="#fff"/>New Appointment</Btn>}>Appointments</SecTitle>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
        {tabs.map(t=><button key={t.id} className="tp" onClick={()=>setFilter(t.id)} style={{border:"none",cursor:"pointer",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:600,whiteSpace:"nowrap",background:filter===t.id?T.pb:T.bg,color:filter===t.id?"#fff":T.muted}}>{t.label}</button>)}
      </div>
      {filtered.length===0&&appointments.length===0&&<Empty icon="calendar" title="No appointments" sub="Schedule your first appointment." action={<Btn onClick={()=>setModal("add")}><Ico n="plus" s={15} c="#fff"/>Schedule</Btn>}/>}
      {filtered.length===0&&appointments.length>0&&<Empty icon="calendar" title="Nothing here" sub="No appointments match this filter."/>}
      {filtered.map((a,i)=>{
        const p=patients.find(x=>x.id===a.patientId);
        const isToday=a.date===todayStr();
        return <Card key={a.id} cls="fu" style={{borderLeft:`4px solid ${isToday&&a.status==="upcoming"?T.gr:sCol(a.status)}`,animationDelay:`${i*30}ms`}}>
          <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
            <div style={{minWidth:50,textAlign:"center",paddingTop:2}}>
              <div style={{fontSize:22,fontWeight:800,color:T.pb,lineHeight:1}}>{new Date(a.date+"T12:00:00").getDate()}</div>
              <div style={{fontSize:10,color:T.muted,fontWeight:600}}>{new Date(a.date+"T12:00:00").toLocaleString("en-GB",{month:"short"})}</div>
              <div style={{fontSize:10,color:T.muted}}>{a.time}</div>
            </div>
            <div style={{width:1,background:T.border,alignSelf:"stretch"}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
                {p&&<Avatar name={p.name} size={28}/>}
                <span style={{fontWeight:700,fontSize:14,color:T.text}}>{p?.name||"Unknown"}</span>
                <Badge label={a.status} color={sCol(a.status)} dot/>
                {isToday&&a.status==="upcoming"&&<Badge label="TODAY" color={T.gr}/>}
              </div>
              <div style={{fontSize:13,color:T.dg}}>{a.reason}</div>
              {a.notes&&<div style={{fontSize:11.5,color:T.muted,marginTop:4,fontStyle:"italic"}}>{a.notes}</div>}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              {a.status==="upcoming"&&<Btn size="sm" variant="green" onClick={()=>complete(a.id)}><Ico n="check" s={13} c="#fff"/></Btn>}
              <Btn size="sm" variant="ghost" onClick={()=>{setSel(a);setModal("edit");}}><Ico n="edit" s={13} c={T.muted}/></Btn>
              <Btn size="sm" variant="ghost" onClick={()=>setConf(a.id)}><Ico n="trash" s={13} c={T.red}/></Btn>
            </div>
          </div>
        </Card>;
      })}
      {modal==="add"&&<Modal title="New Appointment" onClose={()=>setModal(null)}><ApptForm patients={patients} onSave={save} onClose={()=>setModal(null)}/></Modal>}
      {modal==="edit"&&sel&&<Modal title="Edit Appointment" onClose={()=>{setModal(null);setSel(null);}}><ApptForm initial={sel} patients={patients} onSave={save} onClose={()=>{setModal(null);setSel(null);}}/></Modal>}
      {conf&&<Confirm msg="Delete this appointment?" onYes={()=>del(conf)} onNo={()=>setConf(null)}/>}
    </div>
  );
};

        <Sel label="Patient (optional)" value={f.patientId} onChange={set("patientId")}><option value="">None</option>{patients.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel>
      </div>
      <Txta label="Notes" value={f.notes||""} onChange={set("notes")} placeholder="Additional details…"/>
      <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",padding:"10px 14px",background:T.bg,borderRadius:10}}>
        <input type="checkbox" checked={Boolean(f.paid)} onChange={e=>setF(p=>({...p,paid:e.target.checked}))} style={{width:16,height:16,cursor:"pointer"}}/>
        <span style={{fontSize:13.5,fontWeight:600,color:T.dg}}>Mark as Paid</span>
        {f.paid&&<Badge label="Paid" color={T.gr}/>}
      </label>
      <Divider/>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn disabled={!valid} onClick={()=>valid&&onSave({...f,amount:Number(f.amount),paid:Boolean(f.paid)})}><Ico n="check" s={15} c="#fff"/> Save Entry</Btn>
      </div>
    </div>
  );
};

const Finance = ({ finance, setFinance, patients }) => {
  const [modal,setModal]=useState(null);
  const [sel,setSel]=useState(null);
  const [fType,setFType]=useState("all");
  const [conf,setConf]=useState(null);

  const totalIn  =finance.filter(f=>f.type==="income"&&f.paid).reduce((s,f)=>s+f.amount,0);
  const totalOut =finance.filter(f=>f.type==="expense"&&f.paid).reduce((s,f)=>s+f.amount,0);
  const unpaid   =finance.filter(f=>f.type==="income"&&!f.paid).reduce((s,f)=>s+f.amount,0);
  const net      =totalIn-totalOut;

  const sorted=[...finance].sort((a,b)=>a.date<b.date?1:-1);
  const filtered=sorted.filter(f=>fType==="all"||f.type===fType||(fType==="unpaid"&&!f.paid&&f.type==="income"));

  const save=form=>{
    if(modal==="add") setFinance(prev=>[...prev,{...form,id:uid()}]);
    else setFinance(prev=>prev.map(f=>f.id===sel.id?{...f,...form}:f));
    setModal(null);setSel(null);
  };
  const togglePaid=id=>setFinance(prev=>prev.map(f=>f.id===id?{...f,paid:!f.paid}:f));
  const del=id=>{setFinance(prev=>prev.filter(f=>f.id!==id));setConf(null);};

  return (
    <div className="fu" style={{display:"flex",flexDirection:"column",gap:18}}>
      <SecTitle action={<Btn onClick={()=>{setSel(null);setModal("add");}}><Ico n="plus" s={15} c="#fff"/>Add Entry</Btn>}>Financial Records</SecTitle>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {[{label:"Total Income",value:ksh(totalIn),color:T.gr,bg:`${T.gr}12`},{label:"Total Expenses",value:ksh(totalOut),color:T.red,bg:`${T.red}12`},{label:"Net Balance",value:ksh(net),color:net>=0?T.pb:T.red,bg:`${T.pb}10`},{label:"Pending",value:ksh(unpaid),color:T.amber,bg:`${T.amber}12`}].map(s=>(
          <div key={s.label} className="sc" style={{background:s.bg,border:`1px solid ${s.color}22`,borderRadius:14,padding:"14px 16px"}}>
            <div style={{fontSize:10,fontWeight:600,color:s.color,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{s.label}</div>
            <div style={{fontSize:17,fontWeight:800,color:s.color}}>{s.value}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:6}}>
        {[["all","All"],["income","Income"],["expense","Expenses"],["unpaid","Unpaid"]].map(([id,label])=>(
          <button key={id} className="tp" onClick={()=>setFType(id)} style={{border:"none",cursor:"pointer",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:600,background:fType===id?T.pb:T.bg,color:fType===id?"#fff":T.muted}}>{label}</button>
        ))}
      </div>
      {filtered.length===0&&finance.length===0&&<Empty icon="wallet" title="No financial records" sub="Start tracking income and expenses." action={<Btn onClick={()=>setModal("add")}><Ico n="plus" s={15} c="#fff"/>Add Entry</Btn>}/>}
      {filtered.map((f,i)=>{
        const p=patients.find(x=>x.id===f.patientId);
        const isIncome=f.type==="income";
        return <Card key={f.id} cls="fu" style={{borderLeft:`4px solid ${isIncome?T.gr:T.red}`,animationDelay:`${i*25}ms`}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:40,height:40,borderRadius:12,background:`${isIncome?T.gr:T.red}14`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{isIncome?"💰":"💸"}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:14,color:T.text}}>{f.description}</div>
              <div style={{fontSize:11.5,color:T.muted}}>{fmtDate(f.date)}{p?` · ${p.name}`:""}{f.category?` · ${f.category}`:""}</div>
              {f.notes&&<div style={{fontSize:11,color:T.muted,fontStyle:"italic",marginTop:2}}>{f.notes}</div>}
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontWeight:800,fontSize:15,color:isIncome?T.gr:T.red}}>{isIncome?"+":"-"} {ksh(f.amount)}</div>
              <button onClick={()=>togglePaid(f.id)} style={{marginTop:4,background:f.paid?`${T.gr}18`:"#f5f5f5",color:f.paid?T.gr:T.muted,border:"none",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"Poppins,sans-serif"}}>{f.paid?"✓ Paid":"Pending"}</button>
            </div>
            <div style={{display:"flex",gap:4,flexShrink:0}}>
              <Btn size="sm" variant="ghost" onClick={()=>{setSel(f);setModal("edit");}}><Ico n="edit" s={13} c={T.muted}/></Btn>
              <Btn size="sm" variant="ghost" onClick={()=>setConf(f.id)}><Ico n="trash" s={13} c={T.red}/></Btn>
            </div>
          </div>
        </Card>;
      })}
      {modal==="add"&&<Modal title="New Finance Entry" onClose={()=>setModal(null)}><FinanceForm patients={patients} onSave={save} onClose={()=>setModal(null)}/></Modal>}
      {modal==="edit"&&sel&&<Modal title="Edit Entry" onClose={()=>{setModal(null);setSel(null);}}><FinanceForm initial={sel} patients={patients} onSave={save} onClose={()=>{setModal(null);setSel(null);}}/></Modal>}
      {conf&&<Confirm msg="Delete this financial entry?" onYes={()=>del(conf)} onNo={()=>setConf(null)}/>}
    </div>
  );
};

// ── ROOT ──────────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]     = useState("home");
  const [patients,setPatients]         = useState(()=>LS.get("uhc_patients",[]));
  const [appointments,setAppointments] = useState(()=>LS.get("uhc_appointments",[]));
  const [records,setRecords]           = useState(()=>LS.get("uhc_records",[]));
  const [finance,setFinance]           = useState(()=>LS.get("uhc_finance",[]));
  const [clock,setClock] = useState(clockStr());

  // Persist to localStorage
  useEffect(()=>LS.set("uhc_patients",patients),[patients]);
  useEffect(()=>LS.set("uhc_appointments",appointments),[appointments]);
  useEffect(()=>LS.set("uhc_records",records),[records]);
  useEffect(()=>LS.set("uhc_finance",finance),[finance]);

  useEffect(()=>{
    const t=setInterval(()=>setClock(clockStr()),30000);
    return ()=>clearInterval(t);
  },[]);

  const todayBadge=appointments.filter(a=>a.date===todayStr()&&a.status==="upcoming").length;
  const NAV=[
    {id:"home",       label:"Home",    icon:"home"},
    {id:"patients",   label:"Patients",icon:"users"},
    {id:"appointments",label:"Schedule",icon:"calendar",badge:todayBadge},
    {id:"records",    label:"Records", icon:"file"},
    {id:"finance",    label:"Finance", icon:"wallet"},
  ];

  return (
    <div style={{minHeight:"100vh",background:T.bg,display:"flex",flexDirection:"column",maxWidth:750,margin:"0 auto"}}>
      <header style={{background:`linear-gradient(135deg,${T.pb} 0%,#1565a0 100%)`,padding:"0 18px",display:"flex",alignItems:"center",justifyContent:"space-between",height:62,position:"sticky",top:0,zIndex:200,boxShadow:"0 2px 12px rgba(13,91,143,.35)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:12,background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Ico n="steth" s={20} c="#fff"/>
          </div>
          <div>
            <div style={{fontWeight:800,fontSize:14.5,color:"#fff",lineHeight:1.1}}>Union Health Clinic</div>
            <div style={{fontSize:10.5,color:"rgba(255,255,255,.65)",fontWeight:500}}>Dr. Kenneth Maima</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {todayBadge>0&&<div style={{background:"rgba(104,180,75,.25)",border:"1px solid rgba(104,180,75,.4)",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,color:"#a8f080",display:"flex",alignItems:"center",gap:5}}><span style={{width:6,height:6,borderRadius:"50%",background:T.gr,display:"inline-block",animation:"pulse 2s infinite"}}/>{todayBadge} today</div>}
          <div style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,.7)",background:"rgba(255,255,255,.1)",borderRadius:20,padding:"4px 12px"}}>{clock}</div>
        </div>
      </header>

      <main style={{flex:1,padding:"20px 16px 90px",overflowY:"auto"}}>
        {tab==="home"          && <Dashboard patients={patients} appointments={appointments} records={records} finance={finance} setTab={setTab}/>}
        {tab==="patients"      && <Patients patients={patients} setPatients={setPatients} records={records} appointments={appointments}/>}
        {tab==="appointments"  && <Appointments appointments={appointments} setAppointments={setAppointments} patients={patients}/>}
        {tab==="records"       && <Records records={records} setRecords={setRecords} patients={patients}/>}
        {tab==="finance"       && <Finance finance={finance} setFinance={setFinance} patients={patients}/>}
      </main>

      <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:750,background:T.wh,borderTop:`1px solid ${T.border}`,display:"flex",zIndex:200,boxShadow:"0 -4px 20px rgba(13,91,143,.10)"}}>
        {NAV.map(n=>{
          const active=tab===n.id;
          return <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,border:"none",background:"none",cursor:"pointer",padding:"10px 4px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,position:"relative"}}>
            {active&&<div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:32,height:3,background:`linear-gradient(90deg,${T.pb},${T.sb})`,borderRadius:"0 0 4px 4px"}}/>}
            <Ico n={n.icon} s={21} c={active?T.pb:T.muted}/>
            {n.badge>0&&<span style={{position:"absolute",top:8,right:"calc(50% - 16px)",background:T.gr,color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,.2)"}}>{n.badge}</span>}
            <span style={{fontSize:9.5,fontWeight:active?700:500,color:active?T.pb:T.muted,letterSpacing:.3}}>{n.label}</span>
          </button>;
        })}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>


<script>
// ── PWA Install prompt ────────────────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});
document.getElementById('install-dismiss').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
  console.log('Union Health Clinic installed successfully.');
});

// ── Service Worker ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.log('SW error:', e));
  });
}
</script>

</body>
</html>
